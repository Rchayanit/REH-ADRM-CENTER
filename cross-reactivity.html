html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.55}
main{max-width:820px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--mute);font-size:.9rem;margin:0}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;cursor:pointer;font:inherit}
.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0;border-left:0}
.lang button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.warn{background:var(--mob);color:var(--text);border-left:4px solid var(--mo);font-size:.88rem}
input[type=search]{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 12px;cursor:pointer;font:inherit;font-size:.88rem}
.chip.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
label.sev{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:.9rem}
.res{border-radius:10px;padding:10px 12px;margin-top:8px;border-left:5px solid}
.res b{display:block}.res small{color:var(--mute)}
.hi{background:var(--hib);border-color:var(--hi)}.mo{background:var(--mob);border-color:var(--mo)}
.lo{background:var(--lob);border-color:var(--lo)}.no{background:var(--nob);border-color:var(--no)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;margin-left:6px}
.hi .tag{color:var(--hi)}.mo .tag{color:var(--mo)}.lo .tag{color:var(--lo)}.no .tag{color:var(--no)}
.tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.tabs button{flex:1;min-width:140px;padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer;font:inherit}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
h2{font-size:1rem;margin:0 0 4px}
.ref{font-size:.8rem;color:var(--mute)}
</style>

r_icm_same:'Same group as the culprit (similar core structure, high chance of cross-allergy): avoid',
r_icm_diff:'Different group (different structure): may be chosen together with premedication and close monitoring',
r_icm_u:'Not placed in a cross-reactivity group in the source: cross-reactivity cannot be excluded; if the agent is necessary, use premedication and close monitoring',
ref12:'Source: Roi Et Hospital ADR Monitoring Center, algorithm for management of suspected iodinated contrast media allergy (2 Jan 2024). * = stocked at Roi Et Hospital. Groups follow the source: Group A (ioxitalamate, iopamidol, iodixanol, iomeprol, ioversol, iohexol, iopromide; all except ioxitalamate share an N-(2,3-dihydroxypropyl)carbamoyl side chain), Group B (iobitridol, ioxaglate), Group C (amidotrizoate; diatrizoate is the same compound). Evidence for cross-allergy among ICM is fairly weak and awaits further studies. Mild reaction with prior use tolerated or no data: may be true allergy or pseudoallergy; use premedication or avoid the whole group, and if an ICM is necessary choose one with lower osmolality together with premedication. High-osmolality agents cause anaphylactoid reactions more easily than low-osmolality agents. Seafood allergy is not a contraindication, but ICM allergy is reported 2 to 3 times more often in these patients: use with care. Risk factors: for immediate reactions, a previous moderate or severe immediate reaction or asthma; for delayed reactions, a previous reaction to ICM or allergy to many agents. Hospital premedication protocol: prednisolone 5 mg 10 tablets at 13, 7 and 1 hours before the scan; cetirizine 10 mg 1 tablet and famotidine 20 mg 1 tablet at 13 and 1 hours before. A corticosteroid given less than 6 hours before contrast does not prevent the reaction.'});
var lang="en",sel=[],RK={no:0,lo:1,mo:2,hi:3};
function rule(a,t){
 if(a.g&&a.g===t.g)return["hi","r_same"];
 if(a.g&&t.g&&((a.g==="A"&&t.g==="B")||(a.g==="B"&&t.g==="A")))return["mo","r_sim"];
 if(a.cls==="P"&&t.cls==="P")return["hi","r_pen"];
 if(a.cls==="M"||t.cls==="M")return["no","r_atm"];
 if(a.cls==="CP"||t.cls==="CP")return["lo","r_carb"];
 return["lo","r_cep"];}
function track(p){try{if(window.goatcounter&&window.goatcounter.count)window.goatcounter.count({path:p,title:p,event:true})}catch(e){}}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function render(){
 var D={bl:DB,ae:E,ns:N,sf:S,fq:FQ,mr:MR,hs:HS,st:ST,pp:PP,la:LA,oi:OI,ic:IC}[grp],rule={bl:ruleB,ae:rule2,ns:rule3,sf:rule4,fq:rule5,mr:rule6,hs:rule7,st:rule8,pp:rule9,la:rule10,oi:rule11,ic:rule12}[grp];
 var T=L[lang],i=lang==="th"?0:1,qv=document.getElementById("q").value.toLowerCase();
 document.documentElement.lang=lang;
 var s={bl:'',ae:'2',ns:'3',sf:'4',fq:'5',mr:'6',hs:'7',st:'8',pp:'9',la:'10',oi:'11',ic:'12'}[grp];document.getElementById('sevt').parentNode.style.display=grp==='oi'?'none':'';['fq','mr','hs','st','pp','la','oi','ic'].forEach(function(g){var b=document.getElementById('t'+g);b.textContent=T['t'+g];b.className=grp===g?'on':''});document.getElementById('tns').textContent=T.tns;document.getElementById('tsf').textContent=T.tsf;document.getElementById('tns').className=grp==='ns'?'on':'';document.getElementById('tsf').className=grp==='sf'?'on':'';
 ["t","st","disc","h1s","h2s","sevt","ref"].forEach(function(k){var m={t:"t"+s,st:"st"+s,disc:"disc",h1s:"h1",h2s:"h2",sevt:"sev"+s,ref:"ref"+s};document.getElementById(k).textContent=T[m[k]]});
 document.getElementById("tbl").textContent=T.tbl;document.getElementById("tae").textContent=T.tae;
 document.getElementById("tbl").className=grp==="bl"?"on":"";document.getElementById("tae").className=grp==="ae"?"on":"";
 document.getElementById("q").placeholder=T.ph;
 
 document.getElementById("list").innerHTML=D.filter(function(d){return !qv||(d.th+d.en).toLowerCase().indexOf(qv)>-1}).map(function(d){
  return '<button class="chip'+(sel.indexOf(d.id)>-1?" sel":"")+'" data-id="'+d.id+'">'+esc(i?d.en:d.th)+'</button>'}).join("");
 var out=document.getElementById("out");
 if(!sel.length){out.innerHTML='<p class="sub">'+T.empty+'</p>';return}
 var A=D.filter(function(d){return sel.indexOf(d.id)>-1}),sev=document.getElementById("sev").checked;
 var rows=D.filter(function(d){return sel.indexOf(d.id)<0&&d.cls!=='LU'}).map(function(t){
  var best=["no",null],why=[];
  A.forEach(function(a){var r=rule(a,t);if(RK[r[0]]>RK[best[0]])best=r});
  if(sev){if(grp==='bl')best=['hi','r_sev'];else if(grp==='ae'&&t.cls!=='NA')best=['hi','r_sev2'];}
  return{t:t,lv:best[0],rs:best[1]}}).sort(function(x,y){return RK[y.lv]-RK[x.lv]});
 out.innerHTML=rows.map(function(r){
  return '<div class="res '+r.lv+'"><b>'+esc(i?r.t.en:r.t.th)+'<span class="tag">'+T[r.lv]+'</span></b><small>'+CL[r.t.cls][i]+' · '+T[r.rs]+'</small></div>'}).join("");
}
document.getElementById("list").addEventListener("click",function(e){var id=e.target.getAttribute("data-id");if(!id)return;
 var k=sel.indexOf(id);if(k>-1)sel.splice(k,1);else{sel.push(id);track('select/'+grp+'/'+id)}render()});
document.getElementById("q").addEventListener("input",render);
document.getElementById("sev").addEventListener("change",function(){track('flag/'+grp+'/'+(this.checked?'on':'off'));render()});


document.getElementById("tbl").onclick=function(){grp="bl";sel=[];track('tab/bl');render()};
document.getElementById("tae").onclick=function(){grp="ae";sel=[];track('tab/ae');render()};
document.getElementById('tns').onclick=function(){grp='ns';sel=[];track('tab/ns');render()};
document.getElementById('tsf').onclick=function(){grp='sf';sel=[];track('tab/sf');render()};
['fq','mr','hs','st','pp','la','oi','ic'].forEach(function(g){document.getElementById('t'+g).onclick=function(){grp=g;sel=[];track('tab/'+g);render()}});
render();
</script>
